; PHP settings on Wasmer Edge (loaded through PHPRC=/config/ in wasmer.toml).

; "E" makes app.yaml env values, secrets and the DB_* settings visible to Laravel.
variables_order = "EGPCS"

memory_limit = 256M
max_execution_time = 60

; Admin uploads: images and short screen recordings.
upload_max_filesize = 20M
post_max_size = 25M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
